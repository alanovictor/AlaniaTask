name: Manter Supabase ativo

# O Supabase gratuito pausa o projeto após 7 dias sem uso. Uma consulta por dia evita isso.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # chave anon PÚBLICA (a mesma do frontend)
      ANON_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indmb3Zham9xbW1vY21rcHdreWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNDMxMTMsImV4cCI6MjEwOTgxOTExM30.vZDzGKDv5UCOJR4cvMCvxbeMQZowbI_j9iPWuWCZDGE
    steps:
      - name: Ping no banco
        run: |
          curl -fsS -X POST https://wfovajoqmmocmkpwkyer.supabase.co/functions/v1/backup             -H "Authorization: Bearer $ANON_JWT" -H 'Content-Type: application/json'             -d '{"action":"ping"}' | tee ping.json
          grep -q '"ok":true' ping.json
      # O GitHub desliga agendamentos de repositórios sem atividade há 60 dias; reativar renova o prazo.
      - name: Manter agendamentos ligados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/backup.yml/enable
